name: Catalog sync

# Refreshes the card catalog + prices in our DB from the Pokémon TCG API.
# Prices move daily; card metadata rarely — a daily full sweep covers both.
on:
  schedule:
    - cron: '0 6 * * *' # every day at 06:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install pg@8 --no-save
      - run: node scripts/sync-catalog.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POKEMON_TCG_API_KEY: ${{ secrets.POKEMON_TCG_API_KEY }}
